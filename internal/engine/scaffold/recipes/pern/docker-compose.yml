version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: [[.ProjectName]]-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: [[.ProjectName]]_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: [[.ProjectName]]-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/[[.ProjectName]]_db?schema=public"
      JWT_SECRET: "some-jwt-secret-key-change-in-prod"
      PORT: 8080
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: [[.ProjectName]]-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
