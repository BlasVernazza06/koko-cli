version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: [[.ProjectName]]-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: [[.ProjectName]]
      MYSQL_USER: mysql
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
