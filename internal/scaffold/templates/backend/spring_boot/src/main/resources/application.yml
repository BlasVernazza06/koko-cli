server:
  port: 8080

spring:
  application:
    name: [[.ProjectName]]-backend
  datasource:
[[ if eq .Database "postgres" ]]
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/[[.ProjectName]]}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
[[ else if eq .Database "mysql" ]]
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/[[.ProjectName]]}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
[[ else ]]
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:[[.ProjectName]];DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
[[ end ]]

management:
  endpoints:
    web:
      exposure:
        include: health,info
